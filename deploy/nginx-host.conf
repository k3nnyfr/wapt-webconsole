# Virtual host for the nginx of the Docker host (docker.example.org). TLS is terminated upstream by proxy.example.org,
# which must forward X-Forwarded-For and X-Forwarded-Proto, allow WebSocket upgrades and large request bodies.
server {
    listen 80;
    server_name wapt-console.example.org;

    # Package uploads (v0.6)
    client_max_body_size 1g;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Keep the client address and scheme seen by proxy.example.org
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # WebSocket (live status)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 1h;
        proxy_request_buffering off;
    }
}
